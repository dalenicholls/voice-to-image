<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Voice → Image</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#f5f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{width:min(760px,100%);margin:auto;padding:28px 18px 50px}
h1{font-size:28px;margin:0 0 8px}
.sub{color:#999;margin:0 0 25px}
.card{background:#151519;border:1px solid #29292f;border-radius:20px;padding:18px;margin-bottom:16px}
textarea{width:100%;min-height:130px;background:#0d0d10;color:#fff;border:1px solid #333;border-radius:14px;padding:14px;font:inherit;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:999px;padding:13px 18px;background:#fff;color:#111;font-weight:700;font-size:15px;cursor:pointer}
button.secondary{background:#29292f;color:#fff}
button.record{width:76px;height:76px;padding:0;font-size:30px;background:#24242a}
button.record.recording{background:#d33;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.status{color:#aaa;font-size:14px;min-height:20px}
img{display:block;width:100%;border-radius:16px;margin-top:14px;background:#08080a}
.hidden{display:none}
label{display:block;font-size:13px;color:#aaa;margin:0 0 7px}
small{color:#777;line-height:1.5}
.err{color:#ff8d8d}
</style>
</head>
<body>
<main>
<h1>Voice → Image</h1>
<p class="sub">Describe an image. Speak it. Generate it.</p>

<div class="card">
  <label>DESCRIPTION</label>
  <textarea id="prompt" placeholder="Press the microphone and describe what you want..."></textarea>
  <div class="row">
    <button id="mic" class="record" title="Record">🎙️</button>
    <button id="generate">Generate image</button>
    <button id="clear" class="secondary">Clear</button>
  </div>
  <p id="status" class="status"></p>
</div>

<div id="result" class="card hidden">
  <label>RESULT</label>
  <img id="image" alt="Generated image">
  <div class="row">
    <button id="download" class="secondary">Save image</button>
    <button id="again">Generate again</button>
  </div>
</div>

<div class="card">
  <small>
    This starter version uses your browser's speech recognition for transcription.
    Image generation is deliberately routed through <code>/api/generate</code> so an API key
    never has to be placed in this HTML file.
  </small>
</div>
</main>

<script>
const promptEl=document.querySelector('#prompt');
const mic=document.querySelector('#mic');
const generate=document.querySelector('#generate');
const clear=document.querySelector('#clear');
const status=document.querySelector('#status');
const result=document.querySelector('#result');
const image=document.querySelector('#image');
const download=document.querySelector('#download');
const again=document.querySelector('#again');

let recognition=null, recording=false;

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  recognition=new SR();
  recognition.lang='en-GB';
  recognition.interimResults=true;
  recognition.continuous=true;
  let base='';
  recognition.onstart=()=>{recording=true;mic.classList.add('recording');status.textContent='Listening…';};
  recognition.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const text=e.results[i][0].transcript;
      if(e.results[i].isFinal) base += (base?' ':'')+text;
      else interim += text;
    }
    promptEl.value=(base+' '+interim).trim();
  };
  recognition.onend=()=>{
    recording=false;mic.classList.remove('recording');
    if(status.textContent==='Listening…') status.textContent='Ready.';
  };
  recognition.onerror=e=>{
    recording=false;mic.classList.remove('recording');
    status.textContent='Microphone error: '+e.error;
  };
  mic.onclick=()=>{
    if(recording){recognition.stop();}
    else{
      // Preserve existing typed text.
      recognition.start();
    }
  };
}else{
  mic.disabled=true;
  status.textContent='Speech recognition is not supported by this browser. Use Chrome on Android.';
}

async function makeImage(){
  const prompt=promptEl.value.trim();
  if(!prompt){status.textContent='Describe something first.';return;}
  generate.disabled=true;again.disabled=true;
  status.textContent='Generating image…';
  result.classList.remove('hidden');
  image.removeAttribute('src');
  try{
    const r=await fetch('/api/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Generation failed');
    image.src=data.image;
    status.textContent='Done.';
  }catch(e){
    status.textContent=e.message;
    status.classList.add('err');
  }finally{
    generate.disabled=false;again.disabled=false;
  }
}

generate.onclick=makeImage;
again.onclick=makeImage;
clear.onclick=()=>{
  promptEl.value='';result.classList.add('hidden');image.removeAttribute('src');
  status.textContent='';
};
download.onclick=()=>{
  if(!image.src)return;
  const a=document.createElement('a');a.href=image.src;a.download='generated-image.png';a.click();
};
</script>
</body>
</html>
